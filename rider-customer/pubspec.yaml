name: rider
description: A logistics and delivery app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  curved_navigation_bar: ^1.0.3
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  random_string: ^2.3.1
  shared_preferences: ^2.2.3
  http: ^1.3.0
  razorpay_flutter: ^1.3.5
  flutterwave_standard: ^1.0.9
  device_preview: ^1.2.0
  timeline_tile: ^2.0.0
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  intl: ^0.20.2
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.8
  device_info_plus: ^12.4.0
  socket_io_client: ^2.0.3+1
  flutter_webrtc: ^1.2.1
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.1.0
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - images/
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: images/app_icon.png
