services:
  # -----------------------------------------------
  # NestJS Backend Web Service
  # -----------------------------------------------
  - type: web
    name: rider-backend
    runtime: node
    repo: https://github.com/Omatsulijoshua/Rider-Project
    rootDir: rider-backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rider-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Generates a secure random key automatically
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PAYSTACK_SECRET
        sync: false # User will input this manually in Render Dashboard if needed
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false

# -----------------------------------------------
# Managed PostgreSQL Database
# -----------------------------------------------
databases:
  - name: rider-db
    plan: free # Uses Render's free PostgreSQL tier
